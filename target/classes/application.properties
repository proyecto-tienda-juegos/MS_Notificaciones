# Puerto en el que corre este microservicio
server.port=8085
spring.application.name=notificaciones-service

# --- Conexion a MySQL ---
# Antes de correr la app, crea la base de datos con: CREATE DATABASE notificaciones_db;
spring.datasource.url=jdbc:mysql://localhost:3306/notificaciones_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Kafka (consumidor) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# El mensaje llega como JSON sin nombre de clase: le decimos a que clase convertirlo
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.tienda.notificaciones.dto.CompraConfirmadaEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tienda.notificaciones.dto

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
